server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          # Trust gateway proxy headers so downstream services see correct scheme/host when needed
          trusted-proxies: ".*"
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**

            - id: auth-logout
              uri: lb://auth-service
              predicates:
                - Path=/logout

            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/order/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**

            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8079/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
