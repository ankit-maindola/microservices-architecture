server:
  port: 8081
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: AUTH_SESSION
        path: /

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  jwt:
    secret: "my-super-secret-key-for-microservice-project"
    expiration: 3600000
    refresh-expiration: 604800000

logging:
  level:
    org:
      springframework:
        security: DEBUG



eureka:
  client:
    service-url:
      defaultZone: http://localhost:8079/eureka/